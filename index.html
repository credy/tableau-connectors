	font-family: 'Atlassian Sans';
	font-style: normal;
	font-weight: 400 653;
	font-display: swap;
	src:
		local('AtlassianSans'),
		local('Atlassian Sans Text'),
		url(https://ds-cdn.prod-east.frontend.public.atl-paas.net/assets/fonts/atlassian-sans/v1/AtlassianSans-latin.woff2)

<body>
    <div class="container container-table">
        <div class="row vertical-center-row">
            <div class="text-center col-md-3 col-md-offset-4">

				<div class="form-group">
					<label for="apiKey">API Key</label>
					<input id="apiKey" name="apiKey" class="form-control form-control-lg" type="text" placeholder="NETgsdjgdf8gdfjhopdfsjh">
					<small id="affiliateHelpBlock" class="form-text text-muted">
						Your hasoffers network API Key.
					</small>
				</div>

                <button type="button" id="submitButton" class="btn btn-success" style="margin: 10px;">Get partner list
                </button>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        (function() {
            var myConnector = tableau.makeConnector();

            myConnector.getSchema = function(schemaCallback) {
                var cols = [{
                    id: "affiliate_id",
                    dataType: tableau.dataTypeEnum.int
                }, {
                    id: "affiliate_name",
                    dataType: tableau.dataTypeEnum.string
                }];

                var tableSchema = {
                    id: "hasoffersPartners",
                    alias: "HasOffers partners",
                    columns: cols
                };

                schemaCallback([tableSchema]);
            };

            myConnector.getData = function(table, doneCallback) {
                var connectionData = JSON.parse(tableau.connectionData);
                var apiKey = connectionData.apiKey;

                $.getJSON(`https://credy.api.hasoffers.com/Apiv3/json?NetworkToken=${apiKey}&Target=Affiliate&Method=findAll&fields[]=company`, function(responseData) {
                    table.appendRows(      
                        Object.entries(responseData.response.data).map((row) => {
                            return { affiliate_id: parseInt(row[1].Affiliate.id), affiliate_name: row[1].Affiliate.company }
                        })
                    );
                    doneCallback();
                });
            };

            tableau.registerConnector(myConnector);

            $(document).ready(function() {
                $("#submitButton").click(function() {
                    var connectionData = {
                        apiKey: document.getElementById('apiKey').value,
                    };
                    tableau.connectionName = "HasOffers partners";
                    tableau.connectionData = JSON.stringify(connectionData);
                    tableau.submit();
                });
            });

        })();
    </script>
</body></html>
